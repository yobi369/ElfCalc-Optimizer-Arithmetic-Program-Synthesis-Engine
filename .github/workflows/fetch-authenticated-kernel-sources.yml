name: Fetch authenticated Kaggle solver notebook sources

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-authenticated-kernel-sources.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Check Kaggle API secret
        id: check-token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN secret is not configured."
            echo "Create a Kaggle API token at https://www.kaggle.com/settings/api and add it to GitHub repository Settings > Secrets and variables > Actions as KAGGLE_API_TOKEN."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover and pull current GoodPJW notebooks
        if: steps.check-token.outputs.has_token == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/goodpjw
          kaggle kernels list --user goodpjw2008 --competition santa-2026 --page-size 100 --csv > bundle/goodpjw-kernels.csv
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          path = Path("bundle/goodpjw-kernels.csv")
          with path.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          selected = []
          for row in rows:
              title = " ".join(str(v or "") for k, v in row.items() if k.lower() in {"title", "name"}).lower()
              ref = row.get("ref") or row.get("kernel") or row.get("slug")
              if ref and ("source-aware frontier" in title or "lns + cp-sat recombine" in title):
                  selected.append((ref, title))
          if not selected:
              print("No matching GoodPJW notebook titles found. Full listing is retained for audit.")
          for ref, title in selected:
              folder = "bundle/goodpjw/" + ref.replace("/", "-")
              Path(folder).mkdir(parents=True, exist_ok=True)
              print("Pulling", ref, title, flush=True)
              subprocess.run(["kaggle", "kernels", "pull", ref, "--path", folder, "--metadata"], check=True)
          PY

      - name: Pull selected independent solver notebooks
        if: steps.check-token.outputs.has_token == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          slugs=(
            "atakanaldemir/santa-2026-joint-recipes-for-large-puzzles"
            "pablodiegoo/santa-2026-deterministic-atlas-solver"
            "avazaku/elf-calc-backward-frontier-rewrite"
            "royalacecat/elf-calculator-residual-cut-search"
            "prvsiyan/santa-2026-elf-calculator"
            "romanrozen/santa-2026-elf-calculator"
            "mizeroluckygall/elf-calculator-best-of-public-merge-polish"
            "alexchilton/rudolph-the-red-nosed-register-allocator"
            "ozertuu/santa-2026-starter-notebook"
            "ishankarnick/santa-2026-frontier-programs-130-994"
            "muhakabartay/santa-2026-strict-verifier-public-merge-anatomy"
            "vigneshsankar1962/santa-2026-free-order-cp-sat-dag-optimizer"
          )
          : > bundle/pull-status.txt
          for slug in "${slugs[@]}"; do
            name="${slug//\//-}"
            mkdir -p "bundle/$name"
            echo "Pulling $slug"
            if kaggle kernels pull "$slug" --path "bundle/$name" --metadata; then
              echo "SUCCESS $slug" | tee -a bundle/pull-status.txt
            else
              echo "SKIPPED_OR_RESTRICTED $slug" | tee -a bundle/pull-status.txt
            fi
          done
          mkdir -p bundle/datasets/goodpjw
          echo "Fetching GoodPJW's current program dataset"
          if kaggle datasets download -d goodpjw2008/santa-2026-dag-lns-programs -p bundle/datasets/goodpjw --unzip; then
            echo "SUCCESS dataset goodpjw2008/santa-2026-dag-lns-programs" | tee -a bundle/pull-status.txt
          else
            echo "SKIPPED_OR_RESTRICTED dataset goodpjw2008/santa-2026-dag-lns-programs" | tee -a bundle/pull-status.txt
          fi
          find bundle -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS.txt


      - name: Pull additional public candidate outputs
        if: steps.check-token.outputs.has_token == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/candidate-outputs
          slugs=(
            "ozertuu/santa-2026-starter-notebook"
            "pardheev/130-982-best-public-score-santa-2026"
            "arsen123/santa-2026-reproducible-dictionary-beam-solver"
            "muhakabartay/santa-2026-strict-verifier-public-merge-anatomy"
            "asteriospanoras/santa-2026-best-public-score-a-gift-per-run"
            "alexchilton/rudolph-the-red-nosed-register-allocator"
            "ishankarnick/santa-2026-frontier-programs-130-994"
            "vigneshsankar1962/santa-2026-free-order-cp-sat-dag-optimizer"
            "vigneshsankar1962/santa-2026-132k-sota-frontier-synthesis-portfolio"
            "pablodiegoo/santa-2026-deterministic-atlas-solver"
            "avazaku/elf-calc-backward-frontier-rewrite"
          )
          : > bundle/candidate-outputs-status.txt
          for slug in "${slugs[@]}"; do
            name="${slug//\\//-}"
            mkdir -p "bundle/candidate-outputs/$name"
            echo "Fetching output for $slug"
            if kaggle kernels output "$slug" -p "bundle/candidate-outputs/$name"; then
              echo "SUCCESS $slug" | tee -a bundle/candidate-outputs-status.txt
            else
              echo "NO_OUTPUT_OR_RESTRICTED $slug" | tee -a bundle/candidate-outputs-status.txt
            fi
          done
          find bundle -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS.txt

      - name: Upload authenticated notebook source bundle
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: santa-authenticated-kernel-sources
          path: bundle/
          retention-days: 30
